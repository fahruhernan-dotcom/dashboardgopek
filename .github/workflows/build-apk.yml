name: Build Android APK (GPK)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Build GPK Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Production Bundle
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL != '' && secrets.VITE_SUPABASE_URL || 'https://kqbxzokrpcwuxrfjshuf.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY != '' && secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtxYnh6b2tycGN3dXhyZmpzaHVmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3NzY1NTYsImV4cCI6MjEwMTM1MjU1Nn0.alDDENQKoFQY67tCk7s0CG2dl-OrIa8IHTMwhTHb_1A' }}
          VITE_MAIA_API_KEY: ${{ secrets.VITE_MAIA_API_KEY || '' }}
          VITE_AI_MODEL: ${{ secrets.VITE_AI_MODEL != '' && secrets.VITE_AI_MODEL || 'xai/grok-4-1-fast-reasoning-latest' }}
          VITE_WHATSAPP_NUMBER: ${{ secrets.VITE_WHATSAPP_NUMBER != '' && secrets.VITE_WHATSAPP_NUMBER || '082133859391' }}
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Configure google-services.json from Secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "✔ google-services.json successfully configured from GitHub Secrets."
          else
            echo "ℹ GOOGLE_SERVICES_JSON secret is empty, skipping."
          fi

      - name: Build Android Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Extract App Version & Build Metadata
        id: meta
        run: |
          node -e "
            const fs = require('fs');
            let version = 'v0.9.5';
            let build = '20260518';
            try {
              const c = fs.readFileSync('src/dashboard/_shared/pages/akun_page/constants.js', 'utf8');
              const vm = c.match(/export const APP_VERSION\s*=\s*['\"]([^'\"]+)['\"]/);
              const bm = c.match(/export const APP_BUILD_NUMBER\s*=\s*([0-9]+)/);
              if (vm) version = vm[1];
              if (bm) build = bm[1];
            } catch(e) {}
            const artName = 'GPK-APK-' + version + '-b' + build;
            console.log('📌 App Version   : ' + version);
            console.log('📌 Build Number  : ' + build);
            console.log('📦 Artifact Name : ' + artName);
            fs.appendFileSync(process.env.GITHUB_ENV, 'APP_VERSION=' + version + '\nAPP_BUILD_NUMBER=' + build + '\nARTIFACT_NAME=' + artName + '\n');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'version=' + version + '\nbuild=' + build + '\nartifact_name=' + artName + '\n');
          "

      - name: Upload GPK APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME || 'GPK-APK-latest' }}
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Deploy APK to Supabase Storage & Track Release
        if: success()
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL != '' && secrets.VITE_SUPABASE_URL || 'https://kqbxzokrpcwuxrfjshuf.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtxYnh6b2tycGN3dXhyZmpzaHVmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3NzY1NTYsImV4cCI6MjEwMTM1MjU1Nn0.alDDENQKoFQY67tCk7s0CG2dl-OrIa8IHTMwhTHb_1A' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtxYnh6b2tycGN3dXhyZmpzaHVmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3NzY1NTYsImV4cCI6MjEwMTM1MjU1Nn0.alDDENQKoFQY67tCk7s0CG2dl-OrIa8IHTMwhTHb_1A' }}
        run: |
          if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "🚀 Publishing APK release to Supabase Storage & Database..."
            node scripts/publish-release.mjs --apk="android/app/build/outputs/apk/debug/app-debug.apk" --version="${{ env.APP_VERSION }}" --build="${{ env.APP_BUILD_NUMBER }}"
          else
            echo "✖ File APK tidak ditemukan di path android/app/build/outputs/apk/debug/app-debug.apk"
            exit 1
          fi
